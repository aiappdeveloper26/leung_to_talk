 try{if(navigator.audioSession&&navigator.audioSession.type!=='playback')navigator.audioSession.type='playback';}catch(e){}
}
function unlockSound(){
 try{
  prepareAudioSession();
  const Ctx=window.AudioContext||window.webkitAudioContext;
  if(!Ctx)return;
  if(!soundContext||soundContext.state==='closed')soundContext=new Ctx();
  if(soundContext.state==='suspended')soundContext.resume().catch(()=>{});
 }catch(e){}
}
function testSound(){
 // This deliberately uses Web Audio, not speechSynthesis, to isolate speaker routing.
 try{
  unlockSound();
  if(!soundContext)throw Error('Web Audio unsupported');
  const ctx=soundContext;
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.type='sine';osc.frequency.value=660;
  gain.gain.setValueAtTime(0.0001,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.22,ctx.currentTime+0.025);
  gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.38);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start(ctx.currentTime+0.01);osc.stop(ctx.currentTime+0.4);
  setAudioStatus('Sound test triggered: a short beep should be audible.','If silent, check volume, mute/audio route, and Bluetooth.');
 }catch(e){setAudioStatus('Sound test error: '+(e.message||String(e)));}
}
function stopSpeech(){
 speechGeneration++;clearTimeout(speechStartTimer);
 if(ttsSupported()&& (currentUtterance||window.speechSynthesis.speaking||window.speechSynthesis.pending||window.speechSynthesis.paused))try{window.speechSynthesis.cancel();}catch(e){}
 currentUtterance=null;speechWasStarted=false;
}
function speak(text,lang=S.lang,rateOverride=null,mode='default'){
 if(!text||!String(text).trim())return;
 if(!ttsSupported()){setAudioStatus('iPhone browser speech synthesis unavailable.');return;}
 if(recording?.state==='recording'||recordStream?.active){toast('Stop recording before playing an example.');return;}
 try{
  // Entire setup and speak() call stays in the original button tap stack.
  unlockSound();
  const engine=window.speechSynthesis;
  const active=!!currentUtterance||engine.speaking||engine.pending||engine.paused;
  speechGeneration++;const generation=speechGeneration;
  clearTimeout(speechStartTimer);
  if(active){try{engine.cancel();}catch(e){}}
  currentUtterance=null;speechWasStarted=false;
  // Never update the Settings DOM within the speech gesture.
  try{voices=engine.getVoices()||[];}catch(e){voices=[];}
  const utterance=new SpeechSynthesisUtterance(String(text));
  utterance.lang=LANG[lang].voice;
  utterance.rate=rateOverride??(Number(P.settings.speed)||1);
  utterance.pitch=1;utterance.volume=1;
  const named=P.settings.voices?.[lang];
  const matches=voices.filter(v=>(v.lang||'').toLowerCase().startsWith(lang==='ja'?'ja':'it'));
  let selected=null;
  // On iPhone, let iOS pick its own voice unless the user specifically chose one.
  // Forcing the first getVoices() entry can produce a silent utterance.
  if(mode==='selected') selected=matches.find(v=>v.voiceURI===named)||matches.find(v=>v.localService)||matches[0]||null;
  else if(mode==='default') selected=matches.find(v=>v.voiceURI===named)||null;
  if(selected)utterance.voice=selected;
  lastSpeech={text:String(text),lang,rate:rateOverride,mode};lastAudioMethod=mode;
  utterance.onstart=()=>{
   if(generation!==speechGeneration)return;
   speechWasStarted=true;clearTimeout(speechStartTimer);
   setAudioStatus('Speech started (event confirmed).',`${lang==='ja'?'Japanese':'Italian'} · ${selected?.name||'iOS system default'} · mode ${mode}. If silent, try the other mode.`);
   addLog('listen');
  };
  utterance.onend=()=>{
   if(generation!==speechGeneration)return;
   clearTimeout(speechStartTimer);currentUtterance=null;
   setAudioStatus('Speech finished (event confirmed).','If nothing was audible, the iPhone speech engine or sound routing is silent even though events fired.');
  };
  utterance.onerror=(event)=>{
   if(generation!==speechGeneration)return;
   clearTimeout(speechStartTimer);currentUtterance=null;
   setAudioStatus('Speech engine error: '+(event.error||'unknown'),'Try native voice mode or reload Safari.');
  };
  currentUtterance=utterance;
  setAudioStatus('Speech request submitted.',`mode ${mode} · ${(matches.length)} ${lang==='ja'?'Japanese':'Italian'} voice(s) listed`);
  engine.speak(utterance);
  if(engine.paused){try{engine.resume();}catch(e){}}
  speechStartTimer=setTimeout(()=>{
   if(generation!==speechGeneration||speechWasStarted)return;
   setAudioStatus('Speech did not report starting.',`pending=${!!engine.pending}; speaking=${!!engine.speaking}; paused=${!!engine.paused}; listed voices=${matches.length}. Try alternate voice mode.`);
  },4500);
 }catch(e){setAudioStatus('Speech exception: '+(e.message||String(e)));}
}
function retryAudio(){
 const previous=lastSpeech;
 stopSpeech();
 speak(previous?.text||(S.lang==='ja'?'こんにちは。':'Buongiorno.'),previous?.lang||S.lang,previous?.rate??null,'default');
}

function audioReport(){
 const synth=ttsSupported()?window.speechSynthesis:null;
 return ['TalkTrip 2.1.2 iPhone sound diagnostics','Language: '+S.lang,'Device: '+navigator.userAgent,
 'Site: '+location.protocol+' // '+location.host,
 'Voices listed: '+voices.filter(v=>(v.lang||'').toLowerCase().startsWith(S.lang)).map(v=>v.name+' '+v.lang).join('; '),
 'Status: '+audioStatus,'Details: '+audioDetails,
 'Speech engine: '+(synth?`pending=${synth.pending}, speaking=${synth.speaking}, paused=${synth.paused}`:'not supported'),
 'WebAudio: '+(soundContext?.state||'not initialized'),
 'Audio session: '+(navigator.audioSession?.type||'unavailable'),
 'Chosen voice: '+(P.settings.voices[S.lang]||'iOS default')].join('\n');
}

ort','textlink topgap')}<div class="notice" style="margin-top:10px"><strong>iPhone audio diagnostics</strong><div id="audio-diagnostic" aria-live="polite">${esc(audioStatus)}${audioDetails?' — '+esc(audioDetails):''}</div><div class="tiny" style="margin-top:6px">First tap speaker beep, then short system voice, then selected native voice. These tests separate speaker output from Safari text-to-speech. Use Safari over HTTPS with screen unlocked. If voice is silent but beep plays, reload Safari or restart Safari and retry. Japanese and Italian system voices can be downloaded under iPhone Settings → Accessibility → Spoken Content → Voices (menu names vary by iOS version). Voice playback may stop when the screen locks.</div></div><div class="notice">Text-to-speech: ${ttsSupported()?'available':'unavailable'} · Local voice recording: ${mediaOk?'available with microphone permission':'unavailable'}. We do not use cloud speech recognition, make API calls, or upload recordings. Device speech voices may vary.</div></div>

function normalize(s,lang){let result=String(s||'').toLowerCase().normalize('NFKC').replace(/[.,!?;:，。！？、・“”「」『』\-'’‘]/g,'').trim();if(lang==='it')result=result.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');else result=result.replace(/\s+/g,'');return result;}
function similarity(a,b){if(!a||!b)return 0;const p=a.length,q=b.length;const row=Array(q+1).fill(0).map((_,i)=>i);for(let i=1;i<=p;i++){let last=row[0];row[0]=i;for(let j=1;j<=q;j++){const t=row[j];row[j]=Math.min(row[j]+1,row[j-1]+1,last+(a[i-1]===b[j-1]?0:1));last=t;}}return 1-row[q]/Math.max(p,q);}
function targetForSpeak(){const sc=scene();if(S.tab!=='scene')return null;if(S.mode==='speak')return sc.turns.filter(x=>x.role==='you')[S.speakStep];if(S.mode==='chat')return sc.turns[S.chatStep];return null;}
function checkWords(value){const item=targetForSpeak();if(!item)return;const expected=normalize(item.target,S.lang),heard=normalize(value,S.lang),score=similarity(expected,heard);S.answerText=value;S.showAnswer=true;if(heard&&score<.72)autoSaveMissed(item.id);S.answerResult={good:score>=.72,details:!heard?'Nothing was entered. Try the example, then repeat.':score>=.9?'The recognized or typed words closely match the model.':score>=.72?'Your words are close. Compare the model and repeat.':'The words differ from the model. Listen, then try again.',heard:value};if(heard)addLog('speak');render();}
function autoSaveMissed(id){if(INDEX[id]&&!P.deck[id]){P.deck[id]={due:Date.now(),reps:0,interval:0,ease:2.5};persist();toast('Difficult phrase saved for spaced review.');}}

async function startRecord(){if(recording&&recording.state==='recording')return;if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('Voice recording needs a compatible browser and microphone permission (usually HTTPS or localhost).');return;}try{clearRecording();recordDiscard=false;recordStream=await navigator.mediaDevices.getUserMedia({audio:true});recordParts=[];recording=new MediaRecorder(recordStream);recording.ondataavailable=e=>{if(e.data.size)recordParts.push(e.data);};recording.onstop=()=>{const mime=recording?.mimeType||'audio/webm';if(!recordDiscard&&recordParts.length)recordURL=URL.createObjectURL(new Blob(recordParts,{type:mime}));recordStream?.getTracks().forEach(t=>t.stop());recordStream=null;recording=null;if(!recordDiscard)render();};recording.start();render();toast('Recording locally. Tap Stop when you finish.');}catch(err){toast('Microphone unavailable or permission denied.');}}
function stopRecord(){if(recording&&recording.state==='recording')recording.stop();}
function gradeCard(rating){const id=dueIds()[0],rec=P.deck[id];if(!rec)return;let interval=0;rec.ease=Number(rec.ease)||2.5;rec.reps=Number(rec.reps)||0;if(rating==='again'){rec.reps=0;rec.ease=Math.max(1.3,rec.ease-.2);rec.due=Date.now()+10*60*1000;rec.interval=0;}else{if(rating==='hard'){rec.ease=Math.max(1.3,rec.ease-.15);interval=rec.reps===0?1:Math.max(1,Math.ceil((rec.interval||1)*1.2));}else if(rating==='good'){interval=rec.reps===0?1:rec.reps===1?3:Math.ceil(Math.max(1,rec.interval)*rec.ease);}else{rec.ease=Math.min(3.2,rec.ease+.15);interval=rec.reps===0?3:Math.ceil(Math.max(1,rec.interval)*rec.ease*1.35);}rec.interval=interval;rec.reps++;rec.due=Date.now()+interval*86400000;}P.lifetime[S.lang].reviewed++;addLog('review');S.reviewReveal=false;persist();render();}
function addPack(id){const sc=DB[S.lang].find(s=>s.id===id)||scene();let added=0;for(const item of sc.words){if(!P.deck[item.id]){P.deck[item.id]={due:Date.now(),reps:0,interval:0,ease:2.5};added++;}}persist();render();toast(added?`${added} words added to your review deck.`:'All words in this pack are already saved.');}
function saveItem(id){if(!INDEX[id])return;if(P.deck[id]){delete P.deck[id];toast('Removed from your review deck.');}else{P.deck[id]={due:Date.now(),reps:0,interval:0,ease:2.5};toast('Added to your review deck.');}persist();render();}
function nextStep(direction){cleanupAudio();const sc=scene();if(S.mode==='listen'||S.mode==='quiz'){S.step=(S.step+direction+sc.turns.length)%sc.turns.length;S.quizAnswer=null;}else if(S.mode==='speak'){const max=sc.turns.filter(x=>x.role==='you').length;S.speakStep=(S.speakStep+direction+max)%max;}S.answerResult=null;S.showAnswer=false;S.answerText='';render();}

function filterList(){const input=$('#scene-search');if(!input)return;S.sceneSearch=input.value;const html=sceneListItems(S.sceneSearch.trim());$('#scene-list').innerHTML=html;$('#scene-no-results').hidden=!!html;}
function filterLibrary(){const input=$('#library-search');if(!input)return;const q=input.value.toLowerCase().trim();S.librarySearch=q;const all=phrasebookItems(),found=q?all.filter(x=>`${x.target} ${x.reading} ${x.en} ${x.sceneTitle}`.toLowerCase().includes(q)):all;const visible=found.slice(0,S.libraryCount);$('#library-items').innerHTML=libraryRows(visible);$('#library-empty').hidden=!!found.length;$('#library-count').textContent=q?`${found.length} result(s) · ${visible.length} shown` :`Showing ${visible.length} of ${all.length} items`;const more=$('[data-action="libraryMore"]');if(more){more.hidden=found.length<=S.libraryCount;more.textContent=`Load more (${Math.max(0,found.length-S.libraryCount)} remaining)`;}}

function importFile(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(!['TalkTrip-v1','TalkTrip-v2','TalkTrip-v2.1','TalkTrip-v2.2'].includes(obj.format)||!obj.data?.deck||!obj.data?.logs||!obj.data?.settings||!obj.data?.completed)throw Error('not TalkTrip backup');if(!window.confirm('Replace the saved progress on this browser with the backup?'))return;P={...initData(),...obj.data,settings:{...initData().settings,...obj.data.settings,voices:{ja:'',it:'',...(obj.data.settings.voices||{})}},games:mergeGames(obj.data.games),ultra:mergeUltra(obj.data.ultra)};persist();navigate('home');toast('Backup restored successfully.');}catch(e){toast('Invalid backup. Please choose a TalkTrip progress JSON file.');}};reader.readAsText(file);}

,{"target":"まだです。おすすめはありますか。","en":"Not yet. Any recommendations?"}]}},{"id":"compliment","name":"Giving a natural compliment","place":"At a craft market","intro":"Say something positive and ask a follow-up question.","culture":"Specific compliments about craftsmanship are less intrusive than personal comments.","root":{"local":"このお皿、すてきでしょう。","meaning":"This plate is lovely, isn't it?","options":[{"target":"本当にきれいですね。","en":"It's really beautiful."},{"target":"色がとても好きです。","en":"I really like the colour."}]},"follow":[{"local":"手作りなんですよ。","meaning":"It's handmade.","options":[{"target":"作るのにどのくらいかかりますか。","en":"How long does it take to make?"},{"target":"すごいですね。どこで作っていますか。","en":"That's impressive. Where do you make it?"}]},{"local":"青い色はこの地域で人気なんです。","meaning":"Blue is popular in this region.","options":[{"target":"そうなんですね。知りませんでした。","en":"I see. I didn't know that."},{"target":"どうして青が人気なんですか。","en":"Why is blue so popular?"}]}],"finish":{"local":"ほかの作品も見てみますか。","meaning":"Would you like to see other pieces?","options":[{"target":"はい、ぜひ見たいです。","en":"Yes, I'd love to."},{"target":"ありがとうございます。少し見て回ります。","en":"Thank you. I'll have a look around."}]}},{"id":"invitation","name":"Joining a local activity","place":"Meeting a new group of friends","intro":"Accept an invitation and coordinate the details.","culture":"An invitation is not an obligation; a brief, friendly response is fine.","root":{"local":"明日、みんなで市場に行くんですが、一緒にどうですか。","meaning":"We're going to the market tomorrow. Would you like to join?","options":[{"target":"いいですね。ぜひ参加したいです。","en":"Sounds great. I'd love to join."},{"target":"ありがとうございます。何時に集まりますか。","en":"Thanks. What time are you meeting?"}]},"follow":[{"local":"食べ歩きもする予定です。","meaning":"We plan to try snacks as we walk around.","options":[{"target":"楽しそうですね。何がおすすめですか。","en":"Sounds fun. What do you recommend?"},{"target":"おなかをすかせて行きます！","en":"I'll come hungry!"}]},{"local":"午前十時に駅で会いましょう。","meaning":"Let's meet at the station at ten.","options":[{"target":"分かりました。どの出口ですか。","en":"Got it. Which exit?"},{"target":"少し遅れそうなときは連絡します。","en":"I'll message if I think I'll be late."}]}],"finish":{"local":"ほかに聞きたいことはありますか。","meaning":"Anything else you'd like to ask?","options":[{"target":"大丈夫です。明日楽しみにしています。","en":"All good. I'm looking forward to tomorrow."},{"target":"ありがとうございます。よろしくお願いします。","en":"Thank you. See you then."}]}},{"id":"decline","name":"Declining politely","place":"A friendly dinner invitation","intro":"Turn down an invitation without sounding abrupt.","culture":"A short explanation and a warm alternative can help keep the relationship friendly.","root":{"local":"今夜、みんなでご飯を食べませんか。","meaning":"Would you like to have dinner with us tonight?","options":[{"target":"誘ってくれてありがとう。でも、今夜は予定があります。","en":"Thanks for inviting me, but I have plans tonight."},{"target":"残念ですが、今日はちょっと難しいです。","en":"I'd love to, but today is difficult."}]},"follow":[{"local":"そうなんですね。また今度どうですか。","meaning":"I see. How about another time?","options":[{"target":"ぜひ！来週なら空いています。","en":"Absolutely! I'm free next week."},{"target":"また誘ってもらえるとうれしいです。","en":"I'd be happy if you invited me again."}]},{"local":"分かりました。無理しないでくださいね。","meaning":"Okay. Don't push yourself.","options":[{"target":"ありがとう。気にかけてくれてうれしいです。","en":"Thanks. I appreciate your kindness."},{"target":"ありがとう。今度は一緒に行きたいです。","en":"Thanks. I'd love to come next time."}]}],"finish":{"local":"週末はどうでしょう。","meaning":"How about the weekend?","options":[{"target":"土曜日なら大丈夫です。","en":"Saturday works for me."},{"target":"予定を確認して連絡します。","en":"I'll check my plans and let you know."}]}},{"id":"exchange","name":"Language exchange meetup","place":"Practising with a new local friend","intro":"Ask for corrections and keep speaking even when stuck.","culture":"You can request slower speech without apologising repeatedly.","root":{"local":"日本語を勉強しているんですか。","meaning":"Are you studying Japanese?","options":[{"target":"はい、まだ勉強中です。","en":"Yes, I'm still learning."},{"target":"はい。会話をもっと練習したいです。","en":"Yes. I want to practise conversation more."}]},"follow":[{"local":"難しい言葉があったら聞いてくださいね。","meaning":"Please ask if there's a difficult word.","options":[{"target":"ありがとうございます。ゆっくり話してもらえますか。","en":"Thanks. Could you speak slowly?"},{"target":"間違えたら直してくれるとうれしいです。","en":"I'd appreciate it if you corrected my mistakes."}]},{"local":"じゃあ、今日は何について話したいですか。","meaning":"So, what would you like to talk about today?","options":[{"target":"旅行の話をしたいです。","en":"I'd like to talk about travel."},{"target":"普段の生活について話したいです。","en":"I'd like to talk about everyday life."}]}],"finish":{"local":"また一緒に練習しましょう。","meaning":"Let's practise together again.","options":[{"target":"ぜひお願いします。","en":"Yes, please!"},{"target":"今日も勉強になりました。","en":"I learned a lot today."}]}},{"id":"contacts","name":"Keeping in touch","place":"After meeting someone while travelling","intro":"Suggest keeping in contact naturally.","culture":"Let the other person choose the contact method; respect a polite no.","root":{"local":"今日は楽しかったですね。","meaning":"Today was fun, wasn't it?","options":[{"target":"本当に楽しかったです。","en":"It was really fun."},{"target":"いろいろ話せてよかったです。","en":"I'm glad we could chat."}]},"follow":[{"local":"また会えたらいいですね。","meaning":"It would be nice to meet again.","options":[{"target":"そうですね。次はいつ空いていますか。","en":"Agreed. When are you free next?"},{"target":"よかったら、連絡先を交換しませんか。","en":"If you'd like, shall we exchange contact details?"}]},{"local":"写真もたくさん撮りましたね。","meaning":"We took lots of photos, didn't we?","options":[{"target":"よかったら、あとで写真を送ります。","en":"I can send the photos later if you want."},{"target":"写真を送ってもらえたらうれしいです。","en":"I'd love it if you sent the photos."}]}],"finish":{"local":"では、また連絡しますね。","meaning":"I'll get in touch again then.","options":[{"target":"はい、楽しみにしています。","en":"Great, I'll look forward to it."},{"target":"気をつけて帰ってください。","en":"Have a safe trip home."}]}}],"it":[{"id":"intro","name":"Meeting someone new","place":"At a language meetup","intro":"Open a relaxed conversation with a local.","culture":"In Italian, ciao and tu are common at informal meetups; use buongiorno and Lei in formal situations.","root":{"local":"Ciao! Sei qui in vacanza?","meaning":"Hi! Are you here on holiday?","options":[{"target":"Sì, sono qui in vacanza.","en":"Yes, I'm here on holiday."},{"target":"Sì, resto qui per una settimana.","en":"Yes, I'm staying here for a week."}]},"follow":[{"local":"È la tua prima volta in Italia?","meaning":"Is this your first time in Italy?","options":[{"target":"Sì, è la prima volta.","en":"Yes, it's my first time."},{"target":"No, non è la prima volta.","en":"No, it's not my first time."}]},{"local":"Che cosa vuoi vedere?","meaning":"What do you want to see?","options":[{"target":"Vorrei visitare il centro storico.","en":"I'd like to visit the old town."},{"target":"Vorrei provare il cibo locale.","en":"I'd like to try local food."}]}],"finish":{"local":"Ti piace questa città?","meaning":"Do you like this city?","options":[{"target":"Sì, mi piace molto!","en":"Yes, I like it a lot!"},{"target":"Sì, le persone sono molto gentili.","en":"Yes, the people are very kind."}]}},{"id":"hometown","name":"Where are you from?","place":"Talking with another traveller","intro":"Say where you come from and ask about the other person.","culture":"Avoid assuming everyone you meet is from the city you are visiting.","root":{"local":"Di dove sei?","meaning":"Where are you from?","options":[{"target":"Vengo da Taiwan.","en":"I'm from Taiwan."},{"target":"Vengo da Hong Kong.","en":"I'm from Hong Kong."}]},"follow":[{"local":"Com'è Taiwan?","meaning":"What's Taiwan like?","options":[{"target":"È un posto molto interessante.","en":"It's a very interesting place."},{"target":"Ci sono tante cose da mangiare.","en":"There are lots of things to eat."}]},{"local":"Non sono mai stato a Hong Kong.","meaning":"I've never been to Hong Kong.","options":[{"target":"Se puoi, vieni un giorno!","en":"Come one day if you can!"},{"target":"È una città molto vivace.","en":"It's a very lively city."}]}],"finish":{"local":"Sei già stato in questa città?","meaning":"Have you visited this city before?","options":[{"target":"Sì, sono già venuto qui.","en":"Yes, I have been here before."},{"target":"No, è la prima volta.","en":"No, it's my first time."}]}},{"id":"foodchat","name":"Talking about food","place":"At a shared table","intro":"Chat about favourites and get a recommendation.","culture":"Meals are a common conversational opening; ask about local specialities.","root":{"local":"Ti piace la cucina italiana?","meaning":"Do you like Italian food?","options":[{"target":"Sì, mi piace moltissimo!","en":"Yes, I love it!"},{"target":"Sì, ma conosco pochi piatti.","en":"Yes, but I know few dishes."}]},"follow":[{"local":"Qual è il tuo piatto preferito?","meaning":"What's your favourite dish?","options":[{"target":"Mi piace molto la pasta.","en":"I really like pasta."},{"target":"Adoro la pizza margherita.","en":"I love margherita pizza."}]},{"local":"Vuoi provare qualcosa di tipico?","meaning":"Would you like to try something typical?","options":[{"target":"Sì, che cosa consigli?","en":"Yes, what do you recommend?"},{"target":"Volentieri! Che cos'è?","en":"Gladly! What is it?"}]}],"finish":{"local":"Preferisci qualcosa di dolce o salato?","meaning":"Do you prefer something sweet or savoury?","options":[{"target":"Qualcosa di dolce, grazie.","en":"Something sweet, thanks."},{"target":"Preferisco qualcosa di salato.","en":"I prefer something savoury."}]}},{"id":"hobbies","name":"Chatting about hobbies","place":"After a community activity","intro":"Discover what you have in common.","culture":"Talking about hobbies is a friendly way to keep the conversation going.","root":{"local":"Che cosa fai nel tempo libero?","meaning":"What do you do in your free time?","options":[{"target":"Gioco a tennis.","en":"I play tennis."},{"target":"Mi piace guardare gli anime.","en":"I like watching anime."}]},"follow":[{"local":"Giochi spesso?","meaning":"Do you play often?","options":[{"target":"Sì, gioco ogni fine settimana.","en":"Yes, I play every weekend."},{"target":"Non molto, ma mi diverto.","en":"Not much, but I enjoy it."}]},{"local":"Qual è il tuo anime preferito?","meaning":"What's your favourite anime?","options":[{"target":"Mi piacciono gli anime sportivi.","en":"I like sports anime."},{"target":"Mi consigli qualcosa?","en":"Can you recommend something?"}]}],"finish":{"local":"Bello! Ne parliamo un'altra volta?","meaning":"Nice! Shall we talk about it another time?","options":[{"target":"Certo, con piacere!","en":"Of course, with pleasure!"},{"target":"Sì, mi farebbe piacere.","en":"Yes, I'd like that."}]}},{"id":"weekend","name":"Plans for tomorrow","place":"On a stroll with a new friend","intro":"Find out what people do at the weekend.","culture":"With new acquaintances, un caffè? or una passeggiata? can be a light invitation.","root":{"local":"Che cosa fai domani?","meaning":"What are you doing tomorrow?","options":[{"target":"Voglio fare una passeggiata.","en":"I want to go for a walk."},{"target":"Non ho ancora programmi.","en":"I don't have plans yet."}]},"follow":[{"local":"C'è un bel parco vicino a qui.","meaning":"There's a nice park near here.","options":[{"target":"È lontano a piedi?","en":"Is it far on foot?"},{"target":"Come si chiama il parco?","en":"What's the park called?"}]},{"local":"C'è un mercato la mattina.","meaning":"There's a market in the morning.","options":[{"target":"A che ora apre?","en":"What time does it open?"},{"target":"Vuoi venire con me?","en":"Do you want to come with me?"}]}],"finish":{"local":"Sembra una bella giornata, vero?","meaning":"It looks like a nice day, doesn't it?","options":[{"target":"Sì, speriamo che ci sia il sole.","en":"Yes, let's hope it's sunny."},{"target":"Sì, speriamo che non piova.","en":"Yes, let's hope it doesn't rain."}]}},{"id":"localtips","name":"Local recommendations","place":"Finding something non-touristy","intro":"Ask a local for their favourite spot.","culture":"Specific requests work better than asking for the single 'best' place.","root":{"local":"Che cosa vuoi fare oggi?","meaning":"What do you want to do today?","options":[{"target":"Vorrei vedere posti meno turistici.","en":"I'd like to see less touristy places."},{"target":"Cerco un posto tranquillo.","en":"I'm looking for somewhere quiet."}]},"follow":[{"local":"Allora prova il mercato del quartiere.","meaning":"Then try the neighbourhood market.","options":[{"target":"Che cosa si vende lì?","en":"What do they sell there?"},{"target":"È aperto anche domenica?","en":"Is it open on Sunday too?"}]},{"local":"C'è un bel giardino vicino al fiume.","meaning":"There's a nice garden near the river.","options":[{"target":"Come ci arrivo?","en":"How do I get there?"},{"target":"È un posto tranquillo?","en":"Is it a quiet place?"}]}],"finish":{"local":"Vuoi un altro consiglio?","meaning":"Would you like another recommendation?","options":[{"target":"No, grazie. Mi hai aiutato molto.","en":"No thanks. You've helped a lot."},{"target":"Sì, grazie! Mi piace esplorare.","en":"Yes, thanks! I like exploring."}]}},{"id":"festival","name":"At a local festival","place":"Talking near a festival stand","intro":"Understand simple local customs and join in.","culture":"Ask permission before photographing people up close, especially performers and children.","root":{"local":"È la tua prima volta a questa festa?","meaning":"Is this your first time at this festival?","options":[{"target":"Sì, è la prima volta!","en":"Yes, it's my first time!"},{"target":"No, sono venuto anche l'anno scorso.","en":"No, I came last year too."}]},"follow":[{"local":"Ti piace questa musica?","meaning":"Do you like this music?","options":[{"target":"Sì, è molto bella.","en":"Yes, it's very beautiful."},{"target":"Come si chiama questo gruppo?","en":"What's this group called?"}]},{"local":"Com'è la festa quest'anno?","meaning":"How's the festival this year?","options":[{"target":"È molto vivace!","en":"It's very lively!"},{"target":"Mi piace più dell'anno scorso.","en":"I like it more than last year."}]}],"finish":{"local":"Hai provato il cibo qui?","meaning":"Have you tried the food here?","options":[{"target":"Sì, ho provato un dolce.","en":"Yes, I tried a dessert."},{"target":"Non ancora. Che cosa consigli?","en":"Not yet. What do you recommend?"}]}},{"id":"compliment","name":"Compliments and curiosity","place":"Looking at handmade objects","intro":"Give a respectful compliment and learn a bit more.","culture":"Compliment an object or craft rather than making personal comments to strangers.","root":{"local":"Ti piace questo vaso?","meaning":"Do you like this vase?","options":[{"target":"Sì, è bellissimo!","en":"Yes, it's beautiful!"},{"target":"Mi piace molto il colore.","en":"I really like the colour."}]},"follow":[{"local":"È fatto a mano.","meaning":"It's handmade.","options":[{"target":"Quanto tempo ci vuole per farlo?","en":"How long does it take to make?"},{"target":"Dove lo fate?","en":"Where do you make it?"}]},{"local":"Questo colore è tipico della zona.","meaning":"This colour is typical of the area.","options":[{"target":"Interessante! Non lo sapevo.","en":"Interesting! I didn't know that."},{"target":"Perché si usa questo colore?","en":"Why do people use this colour?"}]}],"finish":{"local":"Vuoi vedere altri oggetti?","meaning":"Do you want to see other objects?","options":[{"target":"Sì, volentieri!","en":"Yes, gladly!"},{"target":"Grazie, do solo un'occhiata.","en":"Thanks, I'm just looking."}]}},{"id":"invitation","name":"Joining a group outing","place":"Invited to the market","intro":"Accept and ask about the details.","culture":"It is normal to confirm a meeting place and time even with informal friends.","root":{"local":"Domani andiamo al mercato. Vuoi venire?","meaning":"We're going to the market tomorrow. Do you want to come?","options":[{"target":"Sì, volentieri!","en":"Yes, gladly!"},{"target":"Grazie! A che ora?","en":"Thanks! At what time?"}]},"follow":[{"local":"Vogliamo provare del cibo locale.","meaning":"We want to try local food.","options":[{"target":"Ottima idea! Che cosa consigli?","en":"Great idea! What do you recommend?"},{"target":"Perfetto, vengo con fame!","en":"Perfect, I'll come hungry!"}]},{"local":"Ci vediamo alle dieci alla stazione.","meaning":"See you at ten at the station.","options":[{"target":"Quale uscita della stazione?","en":"Which station exit?"},{"target":"Va bene, ci vediamo lì.","en":"All right, I'll see you there."}]}],"finish":{"local":"Hai altre domande?","meaning":"Do you have other questions?","options":[{"target":"No, grazie. A domani!","en":"No, thanks. See you tomorrow!"},{"target":"Sì, posso portare un amico?","en":"Yes, can I bring a friend?"}]}},{"id":"decline","name":"Declining an invitation","place":"A dinner invitation","intro":"Say no politely while keeping the door open.","culture":"Grazie, ma... is a useful gentle refusal. Avoid inventing elaborate excuses.","root":{"local":"Vieni a cena con noi stasera?","meaning":"Are you coming to dinner with us tonight?","options":[{"target":"Grazie, ma stasera non posso.","en":"Thanks, but I can't tonight."},{"target":"Mi dispiace, ho già un impegno.","en":"I'm sorry, I already have plans."}]},"follow":[{"local":"Nessun problema. Un'altra volta?","meaning":"No problem. Another time?","options":[{"target":"Sì, molto volentieri!","en":"Yes, I'd love to!"},{"target":"Certo, magari la prossima settimana.","en":"Sure, perhaps next week."}]},{"local":"Va bene, non ti preoccupare.","meaning":"Okay, don't worry.","options":[{"target":"Grazie per avermi invitato.","en":"Thanks for inviting me."},{"target":"Grazie, sei molto gentile.","en":"Thanks, that's very kind of you."}]}],"finish":{"local":"E sabato, sei libero?","meaning":"And Saturday, are you free?","options":[{"target":"Sì, sabato va bene.","en":"Yes, Saturday works."},{"target":"Controllo e ti faccio sapere.","en":"I'll check and let you know."}]}},{"id":"exchange","name":"Language exchange","place":"Meeting a language partner","intro":"Practise imperfect Italian comfortably.","culture":"You can ask for simpler words or slower speech at any point.","root":{"local":"Stai imparando l'italiano?","meaning":"Are you learning Italian?","options":[{"target":"Sì, sono ancora all'inizio.","en":"Yes, I'm still a beginner."},{"target":"Sì, voglio parlare di più.","en":"Yes, I want to speak more."}]},"follow":[{"local":"Se vuoi, posso parlare piano.","meaning":"If you like, I can speak slowly.","options":[{"target":"Grazie, sarebbe utile.","en":"Thanks, that would help."},{"target":"Sì, per favore. Parla lentamente.","en":"Yes, please. Speak slowly."}]},{"local":"Di che cosa vuoi parlare?","meaning":"What do you want to talk about?","options":[{"target":"Vorrei parlare di viaggi.","en":"I'd like to talk about travelling."},{"target":"Parliamo della vita quotidiana.","en":"Let's talk about everyday life."}]}],"finish":{"local":"Vuoi praticare ancora insieme?","meaning":"Do you want to practise together again?","options":[{"target":"Sì, con piacere!","en":"Yes, with pleasure!"},{"target":"Grazie, oggi ho imparato molto.","en":"Thanks, I learned a lot today."}]}},{"id":"contacts","name":"Keep in touch","place":"At the end of a friendly afternoon","intro":"Suggest staying in touch without pressure.","culture":"Offer a contact method, and respect it if the other person prefers not to share.","root":{"local":"È stato bello parlare con te!","meaning":"It was nice talking with you!","options":[{"target":"Anche per me!","en":"For me too!"},{"target":"Mi sono divertito molto.","en":"I had a lot of fun."}]},"follow":[{"local":"Ti va di rivederci?","meaning":"Would you like to meet again?","options":[{"target":"Sì, quando sei libero?","en":"Yes, when are you free?"},{"target":"Volentieri! Restiamo in contatto?","en":"Gladly! Shall we stay in touch?"}]},{"local":"Abbiamo fatto tante foto!","meaning":"We took lots of pictures!","options":[{"target":"Se vuoi, te le mando.","en":"I can send them to you if you like."},{"target":"Sì, grazie! Mi farebbe piacere.","en":"Yes thanks! I'd like that."}]}],"finish":{"local":"Allora ci sentiamo presto!","meaning":"Then speak soon!","options":[{"target":"Certo, a presto!","en":"Of course, see you soon!"},{"target":"Buon rientro e grazie di tutto!","en":"Safe trip home, and thanks for everything!"}]}}]};
const STYLE_BANK = {"ja":[{"id":"cafe","context":"Ordering from café staff","en":"Ask for coffee","polite":"コーヒーを一杯お願いします。","friendly":"コーヒー、一つください。","tip":"Both work in a café; ください is direct but still polite. Avoid bare commands."},{"id":"train","context":"Asking station staff","en":"Ask someone to say it again","polite":"もう一度説明していただけますか。","friendly":"もう一回教えてもらえる？","tip":"Use the first with staff; the second is for a friend."},{"id":"friends","context":"Inviting a friend","en":"Suggest coffee together","polite":"よかったら、一緒にカフェに行きませんか。","friendly":"一緒にカフェ行かない？","tip":"〜ませんか is a polite invitation; 〜ない？ sounds relaxed."},{"id":"hotel_issue","context":"Asking reception for help","en":"Request help with a problem","polite":"確認していただけますか。","friendly":"ちょっと見てもらえる？","tip":"Reception generally calls for the polite version."},{"id":"intro","context":"At a first meeting","en":"Say you're happy to meet someone","polite":"お会いできてうれしいです。","friendly":"会えてうれしい！","tip":"Start polite with someone new; use the relaxed form with peers."},{"id":"hometown","context":"Discussing hometowns","en":"Ask where someone is from","polite":"ご出身はどちらですか。","friendly":"どこ出身？","tip":"The second is for friends or peers you've become close to."},{"id":"foodchat","context":"Talking about favourite dishes","en":"Ask what food someone likes","polite":"どんな料理が好きですか。","friendly":"どんな食べ物が好き？","tip":"どんな料理が好き？ is a friendly alternative."},{"id":"hobbies","context":"Talking about hobbies","en":"Ask about someone's hobby","polite":"趣味は何ですか。","friendly":"趣味は何？","tip":"Dropping ですか makes the question casual."},{"id":"weekend","context":"Planning tomorrow","en":"Ask about tomorrow's plans","polite":"明日は何をする予定ですか。","friendly":"明日、何する予定？","tip":"Don't use the relaxed version with hotel staff."},{"id":"localtips","context":"Asking for recommendations","en":"Ask for a recommended place","polite":"おすすめの場所はありますか。","friendly":"おすすめの場所ある？","tip":"The casual version works naturally with friends."},{"id":"festival","context":"At a local festival","en":"Ask if it's their first time","polite":"このお祭りは初めてですか。","friendly":"このお祭り、初めて？","tip":"At a public event, start politely with strangers."},{"id":"compliment","context":"Admiring a craft item","en":"Compliment the colour","polite":"色がとてもきれいですね。","friendly":"この色、すごくきれい！","tip":"Complimenting the object is less personal than appearance-based remarks."},{"id":"invitation","context":"Inviting someone along","en":"Ask if they want to join","polite":"よかったら、一緒に行きませんか。","friendly":"一緒に行かない？","tip":"A casual invitation is appropriate once you know each other."},{"id":"decline","context":"Responding to an invitation","en":"Decline an invitation gently","polite":"すみません、今日は予定があります。","friendly":"ごめん、今日は予定があるんだ。","tip":"A brief reason plus thanks feels less abrupt."},{"id":"exchange","context":"At language exchange","en":"Ask them to speak more slowly","polite":"もう少しゆっくり話していただけますか。","friendly":"もうちょっとゆっくり話してくれる？","tip":"Use either according to your relationship."},{"id":"contacts","context":"Staying in touch","en":"Ask to exchange contact details","polite":"よかったら、連絡先を交換しませんか。","friendly":"連絡先交換しない？","tip":"Respect a polite no and avoid pressing the question."}],"it":[{"id":"cafe","context":"Ordering from a barista","en":"Ask for coffee","polite":"Vorrei un caffè, per favore.","friendly":"Un caffè, grazie.","tip":"Both are acceptable in a café; the first is more explicitly polite."},{"id":"train","context":"Asking station staff","en":"Ask if someone can help","polite":"Mi può aiutare, per favore?","friendly":"Mi puoi aiutare?","tip":"Use Lei (può) for unfamiliar staff; tu (puoi) with friends."},{"id":"friends","context":"Inviting a friend","en":"Suggest having a coffee","polite":"Ti andrebbe di prendere un caffè?","friendly":"Prendiamo un caffè?","tip":"Both are friendly; the second is shorter and more relaxed."},{"id":"hotel_issue","context":"At hotel reception","en":"Request assistance","polite":"Mi potrebbe aiutare, per favore?","friendly":"Mi può aiutare?","tip":"Both keep polite Lei; use either at reception."},{"id":"intro","context":"At an informal meeting","en":"Say it's nice to meet someone","polite":"Piacere di conoscerla.","friendly":"Piacere di conoscerti!","tip":"Conoscerla is formal Lei; conoscerti is informal tu."},{"id":"hometown","context":"Discussing hometowns","en":"Ask where someone is from","polite":"Di dov'è?","friendly":"Di dove sei?","tip":"The first uses polite Lei, the second familiar tu."},{"id":"foodchat","context":"Talking about food","en":"Ask what they like to eat","polite":"Che cosa Le piace mangiare?","friendly":"Che cosa ti piace mangiare?","tip":"Le versus ti distinguishes polite and informal address."},{"id":"hobbies","context":"Talking about interests","en":"Ask what they do in free time","polite":"Che cosa fa nel tempo libero?","friendly":"Che cosa fai nel tempo libero?","tip":"Fa (Lei) is formal; fai (tu) is informal."},{"id":"weekend","context":"Talking about plans","en":"Ask about tomorrow","polite":"Ha programmi per domani?","friendly":"Hai programmi per domani?","tip":"Ha (Lei) works with strangers; hai (tu) with friends."},{"id":"localtips","context":"Asking for recommendations","en":"Ask for a local recommendation","polite":"Mi consiglia un posto tranquillo?","friendly":"Mi consigli un posto tranquillo?","tip":"Consiglia (Lei) versus consigli (tu)."},{"id":"festival","context":"Talking at a festival","en":"Ask whether it's their first time","polite":"È la sua prima volta a questa festa?","friendly":"È la tua prima volta a questa festa?","tip":"Sua marks formal address; tua is informal."},{"id":"compliment","context":"At a craft stall","en":"Compliment the object","polite":"Questo oggetto è molto bello.","friendly":"Che bello questo oggetto!","tip":"Both work; the relaxed version sounds more spontaneous."},{"id":"invitation","context":"Inviting someone along","en":"Ask someone to join","polite":"Le va di venire con noi?","friendly":"Ti va di venire con noi?","tip":"Le is formal; ti is informal. Informal suits new friends."},{"id":"decline","context":"Declining an invitation","en":"Say you can't come tonight","polite":"La ringrazio, ma stasera non posso.","friendly":"Grazie, ma stasera non posso.","tip":"The shorter version is natural among friends."},{"id":"exchange","context":"Asking a language partner","en":"Ask for slower speech","polite":"Può parlare più lentamente, per favore?","friendly":"Puoi parlare più lentamente?","tip":"Choose può for formal address; puoi for tu."},{"id":"contacts","context":"After meeting someone","en":"Suggest staying in touch","polite":"Le andrebbe di restare in contatto?","friendly":"Ti va di restare in contatto?","tip":"Use the informal version with people who already use tu with you."}]};
function addSocialAdventures(){
  for(const lang of ['ja','it']){
    const culture={
      ja:{cafe:'Use 〜お願いします when addressing staff; it is polite without being overly formal.',train:'With station staff, 〜いただけますか is a safe polite request.',friends:'Use casual forms with close friends, but start politely with new acquaintances.',hotel_issue:'For hotel staff, brief polite requests and clear descriptions work well.'},
      it:{cafe:'Vorrei... is polite; un caffè, grazie is also natural at the bar.',train:'Use Lei / può with unfamiliar staff, and tu / puoi with peers.',friends:'Informal friends usually use tu, but start formal when the situation calls for it.',hotel_issue:'Reception staff usually use Lei with guests; reply politely.'}
    };
    for(const old of BRANCH_BANK[lang]){old.category=old.id==='friends'?'Social':'Essential';old.culture=culture[lang][old.id]||'';}
    for(const s of SOCIAL_BANK[lang]){
      const nodes={root:{local:s.root.local,meaning:s.root.meaning,options:s.root.options.map((o,i)=>({...o,next:`branch${i}`}))}};
      for(let i=0;i<2;i++)nodes[`branch${i}`]={local:s.follow[i].local,meaning:s.follow[i].meaning,options:s.follow[i].options.map(o=>({...o,next:'finish'}))};
      nodes.finish={local:s.finish.local,meaning:s.finish.meaning,options:s.finish.options.map(o=>({...o,next:'end',reply:lang==='ja'?'それでは、また！':'A presto!',replyEn:'See you again!'}))};
      BRANCH_BANK[lang].push({id:s.id,name:s.name,place:s.place,intro:s.intro,culture:s.culture,category:'Social',nodes});
    }
    for(const b of BRANCH_BANK[lang])for(const [nodeId,node] of Object.entries(b.nodes))for(let i=0;i<node.options.length;i++){
      const opt=node.options[i],id=`${lang}:role:${b.id}:${nodeId}:${i}`;
      opt.itemId=id;
      INDEX[id]={id,lang,sceneTitle:b.name,sceneId:b.id,role:'you',type:'phrase',target:opt.target,reading:'',en:opt.en};
    }
    for(const c of STYLE_BANK[lang]){
      for(const kind of ['polite','friendly']){
        const id=`${lang}:style:${c.id}:${kind==='polite'?'p0':'p1'}`;
        INDEX[id]={id,lang,sceneTitle:'Say it naturally · '+c.id,sceneId:c.id,type:'phrase',role:'you',reading:'',target:c[kind],en:`${c.en} (${kind})`};
      }
    }
  }
}
addSocialAdventures();

function shuffled(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

 return `${actionBtn('gameMenu','← Practice games','back')}<div class="game-progress"><span class="tracklabel">SAY IT NATURALLY · ${G.round+1} / ${G.order.length}</span><span class="pill">${G.score} points</span></div><div class="bars"><span style="width:${(G.round+1)*100/G.order.length}%"></span></div>
 <div class="practice topgap"><div class="tone">CHOOSE THE REGISTER</div><h2>${target==='polite'?'More polite / careful':'More relaxed / friendly'}</h2><p class="register-context">One idea, two natural ways to express it.</p><div class="promptbox">${esc(c.en)}</div><p class="sub">Both versions can be useful. Pick the requested style, and say the phrase aloud before tapping.</p><div class="register-options">${options.map(kind=>`<button data-action="stylePick" data-value="${kind}" class="${done?(kind===target?'correct':(G.answered===kind?'wrong':'')):''}" ${done?'disabled':''}>${esc(c[kind])}</button>`).join('')}</div>${feedback}</div>`;
}
function stylePick(value){if(G.answered!==null)return;const c=getStyle(G.order[G.round]),correct=G.styleKinds[G.round];if(!c||!['polite','friendly'].includes(value))return;G.answered=value;if(correct===value)G.score++;else autoSaveMissed(styleId(c,correct));render();}
function styleNext(){if(G.answered===null)return;G.round++;G.answered=null;if(G.round===G.order.length){saveBest('style');addLog('style');}render();}

function sprintPick(id){if(G.answered!==null)return;const correct=G.order[G.round];G.answered=id;if(id===correct){G.score++;}else{autoSaveMissed(correct);}render();}
function sprintNext(){if(G.answered===null)return;G.round++;G.answered=null;if(G.round===G.order.length){saveBest('sprint');addLog('sprint');}render();}
function buildAdd(ix){if(G.answered!==null||G.chosen.includes(ix))return;G.chosen.push(ix);render();}
function buildRemove(pos){if(G.answered!==null)return;G.chosen.splice(pos,1);render();}
function buildCheck(){if(G.answered!==null||G.chosen.length!==G.pieces.length)return;const item=INDEX[G.order[G.round]],assembled=G.chosen.map(i=>G.pieces[i].text).join(S.lang==='it'?' ':'');const success=normalize(assembled,S.lang)===normalize(item.target,S.lang);G.answered=success;if(success)G.score++;else autoSaveMissed(item.id);render();}
function builderNext(){if(G.answered===null)return;G.round++;if(G.round===G.order.length){saveBest('builder');addLog('builder');}else prepareBuilder();render();}
function rolePick(ix){if(G.roleSelected!==null)return;const node=currentBranch().nodes[G.node];if(!node||!node.options[ix])return;G.roleSelected=ix;render();}
function roleAdvance(){if(G.roleSelected===null)return;const node=currentBranch().nodes[G.node],choice=node.options[G.roleSelected];G.history.push({text:choice.target,en:choice.en});cleanupAudio();G.node=choice.next;G.roleSelected=null;G.roleReveal=!G.roleChallenge;if(G.node==='end'){P.games[S.lang].role.plays=(P.games[S.lang].role.plays||0)+1;const completed=P.games[S.lang].role.completed||(P.games[S.lang].role.completed={});completed[G.roleId]=(completed[G.roleId]||0)+1;addLog('roleplay');persist();}render();}
function shadowRate(rating){if(!G.order[G.round])return;const item=INDEX[G.order[G.round]];if(rating==='again')autoSaveMissed(item.id);P.games[S.lang].shadow.reps=(P.games[S.lang].shadow.reps||0)+1;addLog('shadow');G.round++;cleanupAudio();G.shadowReveal=false;if(G.round===G.order.length){P.games[S.lang].shadow.plays=(P.games[S.lang].shadow.plays||0)+1;persist();}render();}

render();
