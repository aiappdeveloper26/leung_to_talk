function parseLessons() {
 const out={ja:[],it:[]};
 for (const lang of ['ja','it']) for (const [id,title,place,goal,tip,turnsRaw,wordsRaw] of LESSONS[lang]) {
   const turns=turnsRaw.trim().split('\n').map((line,i)=>{const a=line.split('|');return {id:`${lang}:${id}:p${i}`,role:a[0],target:a[1],reading:a[2]||'',en:a[3]};});
   const words=wordsRaw.split(/;(?=[^;|\n]+\|[^;|\n]*\|)/).map((line,i)=>{const a=line.split('|');return {id:`${lang}:${id}:w${i}`,target:a[0],reading:a[1]||'',en:a[2]};});
   out[lang].push({id,title,place,goal,tip,turns,words});
 }
 return out;
}

function quizView(sc){const item=sc.turns[S.step],opts=quizOptions(sc),answered=S.quizAnswer!==null,isRight=answered&&S.quizAnswer===item.en;return `<div class="practice"><div class="practice-top"><span class="tracklabel">LISTENING CHALLENGE · ${S.step+1}/${sc.turns.length}</span><span class="pill">NO READING</span></div><div class="center" style="padding:14px 0 8px"><div class="actionicon" style="margin:auto;height:62px;width:62px;font-size:29px;border-radius:20px">◖))</div><h3 style="margin:16px 0 10px">What did you hear?</h3><p class="sub">Play the audio, then choose the meaning.</p>${actionBtn('play','▶ Play phrase','primary topgap',`data-id="${item.id}"`)}</div><div class="options">${opts.map(x=>actionBtn('quizAnswer',esc(x.en),`option ${answered?(x.en===item.en?'correct':(S.quizAnswer===x.en?'wrong':'')):''}`,`data-value="${esc(x.en)}" ${answered?'disabled':''}`)).join('')}</div>${answered?`<div class="notice ${isRight?'good':'bad'}">${isRight?'Correct!':'Not quite.'} ${esc(item.target)}${S.lang==='ja'&&P.settings.reading?`<div class="reading">${esc(item.reading)}</div>`:''}</div>`:''}</div><div class="navrow">${actionBtn('prev','← Previous','outline',S.step===0?'disabled':'')}${actionBtn('next',S.step===sc.turns.length-1?'Replay quiz ↻':'Next sound →','primary')}</div>`;}
function speakView(sc){const user=sc.turns.filter(x=>x.role==='you'),item=user[S.speakStep];return `<div class="practice"><div class="practice-top"><span class="tracklabel">YOUR TURN · ${S.speakStep+1}/${user.length}</span><span class="pill">SPEAK IN ${S.lang==='ja'?'JAPANESE':'ITALIAN'}</span></div><div class="tone">SAY THIS NATURALLY</div><div class="promptbox">${esc(item.en)}</div>${S.showAnswer?`<div style="margin-bottom:14px">${speechText(item)}</div>`:''}${actionBtn('reveal',S.showAnswer?'Hide example':'Need a hint? Show example','textlink')}<div class="practice-footer">${actionBtn('recognize',recognizing?'Listening...':'◉ Speak with mic','primary',recognizing?'disabled':'')}${actionBtn('play','▶ Hear example','secondary',`data-id="${item.id}"`)}</div>${recordingView()}<div class="divider"></div><label class="tracklabel" for="speak-entry">OR TYPE YOUR ANSWER</label><input id="speak-entry" class="inputline" autocomplete="off" value="${esc(S.answerText)}" placeholder="Type in ${S.lang==='ja'?'Japanese':'Italian'}"/>${actionBtn('checkAnswer','Check words','secondary wide topgap')}${resultView(item)}<div class="notice">The mic checks recognized words, not your accent or pronunciation. Recording and replay help you compare your sound yourself.</div></div><div class="navrow">${actionBtn('speakPrev','← Previous','outline',S.speakStep===0?'disabled':'')}${actionBtn('speakNext',S.speakStep===user.length-1?'Again ↻':'Next prompt →','primary')}</div>`;}
function recordBtn(){return recording&&recording.state==='recording'?actionBtn('stopRecord','■ Stop recording','outline'):actionBtn('startRecord','● Record my voice','outline');}
function recordingView(){return `<div class="row topgap" style="flex-wrap:wrap">${recordBtn()}${recordURL?actionBtn('playRecord','▶ Play my recording','secondary'):''}</div><p class="tiny topgap">Voice recording stays in this session; it is not uploaded or stored.</p>`;}
function resultView(item){if(!S.answerResult)return '';const r=S.answerResult;return `<div class="notice ${r.good?'good':'bad'}"><strong>${r.good?'Good text match':'Try the phrase again'}</strong><div>${esc(r.details)}</div><div style="margin-top:6px"><strong>Model:</strong> ${esc(item.target)}</div>${r.heard?`<div><strong>Heard:</strong> ${esc(r.heard)}</div>`:''}</div>`;}
function chatView(sc){if(S.chatStep>=sc.turns.length)return `<div class="practice journey-done"><div class="medal">✦</div><h2>You finished the conversation!</h2><p class="sub" style="margin:15px 0 24px">You navigated ${esc(sc.title.toLowerCase())}. Revisit difficult replies in your review deck.</p>${actionBtn('restartChat','Practise again','primary wide')}${actionBtn('mode','Explore the words','secondary wide topgap','data-value="words"')}</div>`;const item=sc.turns[S.chatStep],isYou=item.role==='you';return `<div class="practice"><div class="practice-top"><span class="tracklabel">LIVE DIALOGUE · ${S.chatStep+1}/${sc.turns.length}</span><span class="pill ${isYou?'warm':'good'}">${isYou?'YOUR RESPONSE':'LOCAL SPEAKS'}</span></div><div class="bars" style="margin-bottom:20px"><span style="width:${(S.chatStep+1)/sc.turns.length*100}%"></span></div>${isYou?`<div class="chatline"><div class="avatar you">YOU</div><div class="bubble you"><div class="tone">YOUR PROMPT (ENGLISH)</div>${esc(item.en)}</div></div>${S.showAnswer?`<div class="chatline"><div class="avatar">KEY</div><div class="bubble">${speechText(item)}</div></div>`:''}<div class="practice-footer">${actionBtn('recognize','◉ Speak reply','primary')}${actionBtn('reveal',S.showAnswer?'Hide answer':'Reveal answer','secondary')}</div>${recordingView()}<input id="speak-entry" class="inputline" autocomplete="off" value="${esc(S.answerText)}" placeholder="Or type your reply"/>${actionBtn('checkAnswer','Check your reply','outline wide')}${resultView(item)}`:`<div class="chatline"><div class="avatar">LOCAL</div><div class="bubble">${speechText(item)}${!P.settings.hideEnglish||S.showAnswer?`<div class="hint">${esc(item.en)}</div>`:''}</div></div><div class="practice-footer">${actionBtn('play','▶ Listen to local','primary',`data-id="${item.id}"`)}${actionBtn('reveal',S.showAnswer?'Hide translation':'Show meaning','secondary')}</div>`}<div class="navrow">${actionBtn('chatPrev','← Back','outline',S.chatStep===0?'disabled':'')}${actionBtn('chatNext',isYou?'Continue conversation →':'My turn →','primary')}</div><p class="tiny" style="margin-top:14px">Scripted practice: the next reply follows this travel scenario, not an AI-generated conversation.</p></div>`;}
function wordsView(sc){return `<div class="practice"><div class="practice-top"><span class="tracklabel">USEFUL WORDS · ${sc.words.length}</span>${actionBtn('addPack','+ Review this pack','secondary')}</div>${sc.words.map(item=>`<div class="wordsrow"><div class="grow"><div class="term ${S.lang==='ja'?'jp':''}">${esc(item.target)}</div>${P.settings.reading&&item.reading?`<div class="tiny">${esc(item.reading)}</div>`:''}<div class="definition">${esc(item.en)}</div></div>${actionBtn('play','▶','mini',`aria-label="Listen to ${esc(item.target)}" data-id="${item.id}"`)}${actionBtn('save',P.deck[item.id]?'★':'☆',`mini ${P.deck[item.id]?'saved':''}`,`aria-label="${P.deck[item.id]?'In review deck':'Save for review'}" data-id="${item.id}"`)}</div>`).join('')}</div>`;}
function reviewView(){const due=dueIds(),total=savedIds().length;let content=showHeader('Remember more, forget less','A few spaced-repetition cards each day, based on the phrases you choose.');content+=`<div class="twogrid topgap"><div class="stat"><strong>${due.length}</strong><span>Due now</span></div><div class="stat"><strong>${total}</strong><span>In your deck</span></div></div>`;if(!due.length)return content+`<div class="empty section"><h2>All caught up</h2><p class="sub" style="margin:10px 0 17px">New cards will appear when their next review is due. Add vocabulary from any travel scene.</p>${actionBtn('navigate','Explore vocabulary →','primary','data-value="scenes"')}<div class="topgap">${actionBtn('addStarter','Add 6 useful words','secondary')}</div></div>`;
const item=INDEX[due[0]];content+=`<div class="section"><div class="section-title"><h2>Memory card</h2><span class="pill">${esc(item.type==='word'?'WORD':'PHRASE')}</span></div><div class="practice"><div class="tracklabel">ENGLISH → ${LANG[S.lang].name.toUpperCase()}</div><div class="deckfront"><div class="pill">${esc(item.sceneTitle)}</div><h2>${esc(item.en)}</h2>${S.reviewReveal?`<div style="margin-top:18px">${speechText(item)}</div>`:'<p class="sub" style="margin-top:18px">Try saying it aloud before revealing.</p>'}</div>${S.reviewReveal?`${actionBtn('play','▶ Hear it','secondary wide',`data-id="${item.id}"`)}<div class="deckactions">${[['again','Again','10 min'],['hard','Hard','~1 day'],['good','Good','Longer'],['easy','Easy','Longest']].map(([val,label,hint])=>actionBtn('grade',`${label}<span>${hint}</span>`,'',`data-value="${val}"`)).join('')}</div>`:actionBtn('reviewReveal','Show answer','primary wide')}</div><p class="sub topgap">Grade how well you recalled the meaning and said the phrase; there is no automatic pronunciation score.</p></div>`;return content;}
function phrasebookItems(){return Object.values(INDEX).filter(x=>x.lang===S.lang&&(S.libraryType==='all'||x.type===S.libraryType));}
function libraryRows(items){return items.map(x=>`<div class="wordsrow library-item"><div class="grow"><div class="term ${S.lang==='ja'?'jp':''}">${esc(x.target)}</div>${P.settings.reading&&x.reading?`<div class="tiny">${esc(x.reading)}</div>`:''}<div class="definition">${esc(x.en)} · ${esc(x.sceneTitle)}</div></div>${actionBtn('play','▶','mini',`data-id="${x.id}" aria-label="Hear phrase"`)}${actionBtn('save',P.deck[x.id]?'★':'☆',`mini ${P.deck[x.id]?'saved':''}`,`data-id="${x.id}" aria-label="Save phrase"`)}</div>`).join('');}
function libraryView(){const all=phrasebookItems(),items=S.librarySearch?all.filter(x=>`${x.target} ${x.reading} ${x.en} ${x.sceneTitle}`.toLowerCase().includes(S.librarySearch.toLowerCase())):all;let markup=showHeader('Your travel phrasebook','Search useful phrases and words. Save any item for future review.');markup+=`<input type="search" class="search" id="library-search" placeholder="Search in English, ${LANG[S.lang].name}..." aria-label="Search phrasebook" value="${esc(S.librarySearch)}"/><div class="switchbar">${[['all','All'],['phrase','Phrases'],['word','Words']].map(([id,label])=>actionBtn('libraryType',label,S.libraryType===id?'active':'',`data-value="${id}"`)).join('')}</div><div class="countlabel topgap" id="library-count">Showing ${Math.min(items.length,S.libraryCount)} of ${items.length} items</div><div class="card" id="library-items" style="padding:4px 15px">${libraryRows(items.slice(0,S.libraryCount))}</div>`;if(items.length>S.libraryCount)markup+=actionBtn('libraryMore',`Load more (${items.length-S.libraryCount} remaining)`,'outline wide topgap');markup+=`<p id="library-empty" class="sub topgap" ${items.length?'hidden':''}>No matching words or phrases.</p>`;return markup;}
function settingsView(){const choices=voices.filter(v=>v.lang.toLowerCase().startsWith(S.lang==='ja'?'ja':'it')),recOk=!!(window.SpeechRecognition||window.webkitSpeechRecognition),mediaOk=!!(navigator.mediaDevices?.getUserMedia&&window.MediaRecorder);const s=P.settings;return `${showHeader('Make it yours','Your private practice space and listening preferences.')}<div class="section"><h2>Audio & learning</h2><div class="setting-row"><div><strong>Speech speed</strong><div class="sub">Slow down the local voice</div></div><select id="speed" aria-label="Playback speed">${[[.75,'Slow · 0.75×'],[.9,'Gentle · 0.9×'],[1,'Normal · 1×'],[1.15,'Fast · 1.15×']].map(([v,l])=>`<option value="${v}" ${Number(s.speed)===v?'selected':''}>${l}</option>`).join('')}</select></div>${S.lang==='ja'?`<div class="setting-row"><div><strong>Show kana reading</strong><div class="sub">Helpful for unfamiliar kanji</div></div>${actionBtn('toggleReading','',`toggle ${s.reading?'on':''}`,`aria-label="Toggle Japanese reading" aria-pressed="${!!s.reading}"`)}</div>`:''}<div class="setting-row"><div><strong>Hide translations in listening</strong><div class="sub">Build comprehension before reading</div></div>${actionBtn('toggleEnglish','',`toggle ${s.hideEnglish?'on':''}`,`aria-label="Hide translations" aria-pressed="${!!s.hideEnglish}"`)}</div><div class="setting-row"><div><strong>${LANG[S.lang].name} voice</strong><div class="sub">Uses voices on your device</div></div><select id="voice" aria-label="Speech voice"><option value="">Automatic</option>${choices.map(v=>`<option value="${esc(v.voiceURI)}" ${s.voices?.[S.lang]===v.voiceURI?'selected':''}>${esc(v.name)}</option>`).join('')}</select></div>${actionBtn('testVoice','▶ Test ${LANG[S.lang].name} voice','secondary wide topgap')}<div class="notice">Text-to-speech: ${ttsSupported()?'available':'unavailable'} · Speech recognition: ${recOk?'supported by browser':'not supported'} · Voice recording: ${mediaOk?'available with microphone permission':'unavailable'}. Recognition may require internet and microphone permission, and your browser may send speech to its recognition service.</div></div>
<div class="section"><h2>My progress</h2><div class="twogrid topgap"><div class="stat"><strong>${P.lifetime[S.lang]?.conversations||0}</strong><span>Completed dialogues</span></div><div class="stat"><strong>${P.lifetime[S.lang]?.reviewed||0}</strong><span>Cards reviewed</span></div></div></div>
<div class="section"><h2>Keep your progress safe</h2><p class="sub" style="margin:9px 0 13px">Saved in this device's browser. Export a backup before switching phones, clearing browser data, or uploading a new site version.</p>${actionBtn('export','↓ Export progress (.json)','primary wide')}${actionBtn('import','↑ Import saved progress','outline wide topgap')}${actionBtn('reset','Reset all saved progress','textlink topgap')}</div><div class="footertext">TalkTrip v1.0 · No account or paid API required. All lessons are built into this file. Speech recognition availability and speech voices vary by device and browser; dialogue replies are scripted, not AI-generated. In a medical or allergy situation, confirm with qualified local staff.</div>`;}
function normalize(s,lang){let result=String(s||'').toLowerCase().normalize('NFKC').replace(/[.,!?;:，。！？、・“”「」『』\-'’‘]/g,'').trim();if(lang==='it')result=result.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');else result=result.replace(/\s+/g,'');return result;}
function similarity(a,b){if(!a||!b)return 0;const p=a.length,q=b.length;const row=Array(q+1).fill(0).map((_,i)=>i);for(let i=1;i<=p;i++){let last=row[0];row[0]=i;for(let j=1;j<=q;j++){const t=row[j];row[j]=Math.min(row[j]+1,row[j-1]+1,last+(a[i-1]===b[j-1]?0:1));last=t;}}return 1-row[q]/Math.max(p,q);}
function targetForSpeak(){const sc=scene();if(S.tab!=='scene')return null;if(S.mode==='speak')return sc.turns.filter(x=>x.role==='you')[S.speakStep];if(S.mode==='chat')return sc.turns[S.chatStep];return null;}
function checkWords(value){const item=targetForSpeak();if(!item)return;const expected=normalize(item.target,S.lang),heard=normalize(value,S.lang),score=similarity(expected,heard);S.answerText=value;S.showAnswer=true;if(heard&&score<.72)autoSaveMissed(item.id);S.answerResult={good:score>=.72,details:!heard?'Nothing was recognized or entered. Try the example, then repeat.':score>=.9?'The recognized or typed words closely match the model.':score>=.72?'Your words are close. Compare the model and repeat.':'The words differ from the model. Listen, then try again.',heard:value};if(heard)addLog('speak');render();}
function autoSaveMissed(id){if(INDEX[id]&&!P.deck[id]){P.deck[id]={due:Date.now(),reps:0,interval:0,ease:2.5};persist();toast('Difficult phrase saved for spaced review.');}}
function beginRecognition(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){toast('Speech recognition is unsupported here. Use the type-to-check box, or record and replay your voice.');return;}if(recognizing)return;try{recognition=new R();recognition.lang=LANG[S.lang].voice;recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=1;recognizing=true;toast('Listening... Speak the phrase clearly.');recognition.onresult=event=>{const words=event.results?.[0]?.[0]?.transcript||'';recognizing=false;recognition=null;checkWords(words);};recognition.onerror=event=>{recognizing=false;recognition=null;toast('Mic recognition failed ('+event.error+'). Try Chrome/Edge with microphone permission, or type your answer.');};recognition.onend=()=>{recognizing=false;recognition=null;};recognition.start();}catch(e){recognizing=false;recognition=null;toast('Speech recognition could not start. Check mic permissions and browser support.');}}
async function startRecord(){if(recording&&recording.state==='recording')return;if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('Voice recording needs a compatible browser and microphone permission (usually HTTPS or localhost).');return;}try{clearRecording();recordDiscard=false;recordStream=await navigator.mediaDevices.getUserMedia({audio:true});recordParts=[];recording=new MediaRecorder(recordStream);recording.ondataavailable=e=>{if(e.data.size)recordParts.push(e.data);};recording.onstop=()=>{const mime=recording?.mimeType||'audio/webm';if(!recordDiscard&&recordParts.length)recordURL=URL.createObjectURL(new Blob(recordParts,{type:mime}));recordStream?.getTracks().forEach(t=>t.stop());recordStream=null;recording=null;if(!recordDiscard)render();};recording.start();render();toast('Recording locally. Tap Stop when you finish.');}catch(err){toast('Microphone unavailable or permission denied.');}}
function stopRecord(){if(recording&&recording.state==='recording')recording.stop();}
function gradeCard(rating){const id=dueIds()[0],rec=P.deck[id];if(!rec)return;let interval=0;rec.ease=Number(rec.ease)||2.5;rec.reps=Number(rec.reps)||0;if(rating==='again'){rec.reps=0;rec.ease=Math.max(1.3,rec.ease-.2);rec.due=Date.now()+10*60*1000;rec.interval=0;}else{if(rating==='hard'){rec.ease=Math.max(1.3,rec.ease-.15);interval=rec.reps===0?1:Math.max(1,Math.ceil((rec.interval||1)*1.2));}else if(rating==='good'){interval=rec.reps===0?1:rec.reps===1?3:Math.ceil(Math.max(1,rec.interval)*rec.ease);}else{rec.ease=Math.min(3.2,rec.ease+.15);interval=rec.reps===0?3:Math.ceil(Math.max(1,rec.interval)*rec.ease*1.35);}rec.interval=interval;rec.reps++;rec.due=Date.now()+interval*86400000;}P.lifetime[S.lang].reviewed++;addLog('review');S.reviewReveal=false;persist();render();}
function addPack(id){const sc=DB[S.lang].find(s=>s.id===id)||scene();let added=0;for(const item of sc.words){if(!P.deck[item.id]){P.deck[item.id]={due:Date.now(),reps:0,interval:0,ease:2.5};added++;}}persist();render();toast(added?`${added} words added to your review deck.`:'All words in this pack are already saved.');}
function saveItem(id){if(!INDEX[id])return;if(P.deck[id]){delete P.deck[id];toast('Removed from your review deck.');}else{P.deck[id]={due:Date.now(),reps:0,interval:0,ease:2.5};toast('Added to your review deck.');}persist();render();}
function nextStep(direction){cleanupAudio();const sc=scene();if(S.mode==='listen'||S.mode==='quiz'){S.step=(S.step+direction+sc.turns.length)%sc.turns.length;S.quizAnswer=null;}else if(S.mode==='speak'){const max=sc.turns.filter(x=>x.role==='you').length;S.speakStep=(S.speakStep+direction+max)%max;}S.answerResult=null;S.showAnswer=false;S.answerText='';render();}
function chatStep(direction){cleanupAudio();const sc=scene();if(direction>0&&S.chatStep===sc.turns.length-1){S.chatStep++;P.completed[S.lang][sc.id]=Date.now();P.lifetime[S.lang].conversations++;addLog('chat');persist();}else S.chatStep=Math.max(0,Math.min(sc.turns.length,S.chatStep+direction));S.showAnswer=false;S.answerText='';S.answerResult=null;render();}
function filterList(){const input=$('#scene-search');if(!input)return;S.sceneSearch=input.value;const html=sceneListItems(S.sceneSearch.trim());$('#scene-list').innerHTML=html;$('#scene-no-results').hidden=!!html;}
function filterLibrary(){const input=$('#library-search');if(!input)return;const q=input.value.toLowerCase().trim();S.librarySearch=q;const all=phrasebookItems(),found=q?all.filter(x=>`${x.target} ${x.reading} ${x.en} ${x.sceneTitle}`.toLowerCase().includes(q)):all;const visible=found.slice(0,S.libraryCount);$('#library-items').innerHTML=libraryRows(visible);$('#library-empty').hidden=!!found.length;$('#library-count').textContent=q?`${found.length} result(s) · ${visible.length} shown` :`Showing ${visible.length} of ${all.length} items`;const more=$('[data-action="libraryMore"]');if(more){more.hidden=found.length<=S.libraryCount;more.textContent=`Load more (${Math.max(0,found.length-S.libraryCount)} remaining)`;}}
function exportFile(){const blob=new Blob([JSON.stringify({format:'TalkTrip-v1',exportedAt:new Date().toISOString(),data:P},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`talktrip-progress-${localDay()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Backup downloaded. Keep it somewhere safe.');}
function importFile(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj.format!=='TalkTrip-v1'||!obj.data?.deck||!obj.data?.logs||!obj.data?.settings||!obj.data?.completed)throw Error('not TalkTrip backup');if(!window.confirm('Replace the saved progress on this browser with the backup?'))return;P={...initData(),...obj.data,settings:{...initData().settings,...obj.data.settings,voices:{ja:'',it:'',...(obj.data.settings.voices||{})}}};persist();navigate('home');toast('Backup restored successfully.');}catch(e){toast('Invalid backup. Please choose a TalkTrip progress JSON file.');}};reader.readAsText(file);}
document.addEventListener('input',event=>{if(event.target.id==='scene-search')filterList();if(event.target.id==='library-search')filterLibrary();if(event.target.id==='speak-entry')S.answerText=event.target.value;});
document.addEventListener('change',event=>{if(event.target.id==='speed'){P.settings.speed=Number(event.target.value);persist();toast(`Playback speed set to ${P.settings.speed}×.`);}if(event.target.id==='voice'){P.settings.voices[S.lang]=event.target.value;persist();toast('Preferred voice saved.');}});
$('#import-file').addEventListener('change',e=>{importFile(e.target.files[0]);e.target.value='';});
document.addEventListener('click',event=>{const btn=event.target.closest('[data-action]');if(!btn||btn.disabled)return;const a=btn.dataset.action,v=btn.dataset.value,id=btn.dataset.id;switch(a){
case 'language':changeLanguage(v);break;case 'navigate':navigate(v);break;case 'openScene':enterScene(v);break;
case 'startMission':enterScene(P.last[S.lang]||'cafe','quiz');break;case 'launchQuiz':enterScene(P.last[S.lang]||'cafe','quiz');break;case 'launchSpeak':enterScene(P.last[S.lang]||'cafe','speak');break;case 'launchChat':enterScene(P.last[S.lang]||'cafe','chat');break;
case 'filterScenes':S.sceneFilter=v;render();break;case 'mode':cleanupAudio();S.mode=v;resetPractice();render();break;
case 'play':if(INDEX[id])speak(INDEX[id].target,INDEX[id].lang);break;case 'save':saveItem(id);break;
case 'prev':nextStep(-1);break;case 'next':nextStep(1);break;case 'speakPrev':nextStep(-1);break;case 'speakNext':nextStep(1);break;
case 'quizAnswer':if(S.quizAnswer!==null)return;S.quizAnswer=v;if(v===scene().turns[S.step].en)addLog('quiz');else autoSaveMissed(scene().turns[S.step].id);render();break;
case 'reveal':S.showAnswer=!S.showAnswer;render();break;case 'recognize':beginRecognition();break;case 'checkAnswer':checkWords(S.answerText);break;
case 'startRecord':startRecord();break;case 'stopRecord':stopRecord();break;case 'playRecord':if(recordURL){const audio=new Audio(recordURL);audio.play().catch(()=>toast('Could not play your recording.'));}break;
case 'chatPrev':chatStep(-1);break;case 'chatNext':chatStep(1);break;case 'restartChat':S.chatStep=0;S.answerResult=null;S.showAnswer=false;render();break;
case 'reviewReveal':S.reviewReveal=true;render();break;case 'grade':gradeCard(v);break;case 'addPack':addPack(scene().id);break;case 'addStarter':addPack(P.last[S.lang]||'cafe');break;
case 'libraryType':S.libraryType=v;S.libraryCount=36;render();break;case 'libraryMore':S.libraryCount+=36;render();break;
case 'toggleReading':P.settings.reading=!P.settings.reading;persist();render();break;case 'toggleEnglish':P.settings.hideEnglish=!P.settings.hideEnglish;persist();render();break;
case 'testVoice':speak(S.lang==='ja'?'すみません、もう少しゆっくり話していただけますか。':'Scusi, può parlare un po’ più lentamente?');break;
case 'export':exportFile();break;case 'import':$('#import-file').click();break;case 'reset':if(window.confirm('Clear progress for BOTH languages? Export a backup first if you want to keep it.')){P=initData();seedDeck(P);persist();navigate('home');toast('Progress reset.');}break;
}});
render();
</script></body></html>
